services:
  raygate:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      RAYGATE_WEB_TOKEN: "${RAYGATE_WEB_TOKEN:?Set RAYGATE_WEB_TOKEN in .env}"
      RAYGATE_HOME: /data
      RAYGATE_WEB_ADDR: "127.0.0.1:8088"
      RAYGATE_PROXY_LISTEN: "${RAYGATE_PROXY_LISTEN:-127.0.0.1}"
      RAYGATE_PROXY_ALLOW_LAN: "${RAYGATE_PROXY_ALLOW_LAN:-false}"
      RAYGATE_PROXY_ALLOW_CIDRS: "${RAYGATE_PROXY_ALLOW_CIDRS:-}"
    volumes:
      - raygate_state:/data

volumes:
  raygate_state:
